site_name: VoxTools
site_description: Cross-platform Swiss-army developer toolkit with CLI, TUI, GUI, and plugins
site_author: VoxHash Technologies
site_url: https://voxhash.github.io/VoxTools

repo_name: VoxHash/VoxTools
repo_url: https://github.com/VoxHash/VoxTools
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Quick Start: quick-start.md
  - Installation: installation.md
  - Usage: usage.md
  - Configuration: configuration.md
  - CLI: cli.md
  - Architecture: architecture.md
  - API: api.md
  - Examples:
      - Example 01: examples/example-01.md
      - Example 02: examples/example-02.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VoxHash/VoxTools
