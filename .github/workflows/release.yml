name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.2)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Tag pushes use github.ref_name; manual runs target an existing release tag.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry config virtualenvs.in-project true
        poetry --version

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Build wheels
      run: poetry build

    - name: Generate release notes
      id: release_notes
      run: |
        TAG="${{ env.RELEASE_TAG }}"
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "## VoxTools $TAG" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "See [CHANGELOG.md](https://github.com/VoxHash/VoxTools/blob/$TAG/CHANGELOG.md) for details." >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        body: ${{ steps.release_notes.outputs.notes }}
        files: dist/*.whl
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    needs: release
    # Skip on workflow_dispatch so a macOS-only repair does not re-upload Linux/Windows.
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry config virtualenvs.in-project true
        poetry --version

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Generate icons
      run: poetry run python scripts/export_icons.py

    - name: Install PyInstaller
      run: poetry add pyinstaller --group dev

    - name: Build CLI binary
      run: poetry run pyinstaller --clean --noconfirm apps/cli/main.py --name voxtools-cli --onefile --distpath dist/binaries

    - name: Build TUI binary
      run: poetry run pyinstaller --clean --noconfirm apps/tui/main.py --name voxtools-tui --onefile --distpath dist/binaries

    - name: Build GUI binary
      run: poetry run pyinstaller --clean --noconfirm apps/gui/main.py --name voxtools-gui --onefile --windowed --distpath dist/binaries

    - name: Create release archive
      run: |
        New-Item -ItemType Directory -Force -Path release
        Copy-Item dist\binaries\* release\
        if (Test-Path assets\icons\*.png) { Copy-Item assets\icons\*.png release\ }
        if (Test-Path assets\icons\*.ico) { Copy-Item assets\icons\*.ico release\ }
        Compress-Archive -Path release\* -DestinationPath voxtools-${{ env.RELEASE_TAG }}-windows.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: voxtools-${{ env.RELEASE_TAG }}-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Binaries
    runs-on: macos-latest
    needs: release

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry config virtualenvs.in-project true
        poetry --version

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Generate icons
      run: poetry run python scripts/export_icons.py

    - name: Install PyInstaller
      run: poetry add pyinstaller --group dev

    - name: Build CLI binary
      run: poetry run pyinstaller --clean --noconfirm apps/cli/main.py --name voxtools-cli --onefile --distpath dist/binaries

    - name: Build TUI binary
      run: poetry run pyinstaller --clean --noconfirm apps/tui/main.py --name voxtools-tui --onefile --distpath dist/binaries

    - name: Build GUI binary
      run: poetry run pyinstaller --clean --noconfirm apps/gui/main.py --name voxtools-gui --onefile --windowed --distpath dist/binaries

    - name: Create release archive
      run: |
        mkdir -p release
        # macOS --windowed GUI builds produce a .app bundle (directory);
        # plain `cp` without -R fails on that path.
        cp -R dist/binaries/. release/
        if [ -d assets/icons ]; then
          cp assets/icons/*.png assets/icons/*.icns release/ 2>/dev/null || true
        fi
        ls -la release
        cd release
        zip -r ../voxtools-${{ env.RELEASE_TAG }}-macos.zip .
        cd ..

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: voxtools-${{ env.RELEASE_TAG }}-macos.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    needs: release
    # Skip on workflow_dispatch so a macOS-only repair does not re-upload Linux/Windows.
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry config virtualenvs.in-project true
        poetry --version

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Generate icons
      run: poetry run python scripts/export_icons.py

    - name: Install PyInstaller
      run: poetry add pyinstaller --group dev

    - name: Build CLI binary
      run: poetry run pyinstaller --clean --noconfirm apps/cli/main.py --name voxtools-cli --onefile --distpath dist/binaries

    - name: Build TUI binary
      run: poetry run pyinstaller --clean --noconfirm apps/tui/main.py --name voxtools-tui --onefile --distpath dist/binaries

    - name: Build GUI binary
      run: poetry run pyinstaller --clean --noconfirm apps/gui/main.py --name voxtools-gui --onefile --windowed --distpath dist/binaries

    - name: Create release archive
      run: |
        mkdir -p release
        cp dist/binaries/* release/
        if [ -d assets/icons ]; then
          cp assets/icons/*.png release/ 2>/dev/null || true
        fi
        cd release
        zip -r ../voxtools-${{ env.RELEASE_TAG }}-linux.zip .
        cd ..

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: voxtools-${{ env.RELEASE_TAG }}-linux.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
